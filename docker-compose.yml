# 一键启动：docker compose up -d
# 默认拉已发布镜像；源码构建见 docker-compose.build.yml，可调项见 .env.example
name: xiaozhi

# 限制容器日志大小，避免撑满磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# server 与 dialogue 共用的环境变量
x-app-environment: &app-environment
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-xiaozhi}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
  SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-xiaozhi}
  SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-123456}
  SPRING_DATA_REDIS_HOST: redis
  # 管理端 JWT 密钥：server 与 dialogue 必须同值（server 签发 Web 聊天/虚拟设备令牌，dialogue 校验）。
  # 不配时两个进程用同一份内置默认值，生产环境必须显式改成随机串。
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-xiaozhi-esp32-server-java-jwt-secret-key}
  # 注册/找回密码邮件；留空时不发信（接口返回发送失败）
  EMAIL_SMTP_USERNAME: ${EMAIL_SMTP_USERNAME:-}
  EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
  # 下发给设备的服务器 IP，留空则自动探测
  HOST_IP: ${HOST_IP:-}
  # 本地存储（录音/上传/曲库）的数据根目录。留空=容器工作目录 /app；
  # 多机部署到不同宿主机时无法共享本地目录，应改用对象存储。
  XIAOZHI_DATA_DIR: ${XIAOZHI_DATA_DIR:-}
  # 对外域名：配了之后 OTA/WS 走 https/wss 子域名；留空按 HOST_IP 走 http/ws。
  # 域名与前缀证书由部署方自己准备，容器不内置任何默认域名。
  XIAOZHI_SERVER_DOMAIN: ${XIAOZHI_SERVER_DOMAIN:-}
  # 反向代理的 IP/CIDR（逗号分隔）。不配时只认 TCP 对端地址，忽略任何 X-Forwarded-For。
  # 变量名必须是「连字符也写成下划线」的形式，见 TrustedProxyEnvBindingTest。
  XIAOZHI_SECURITY_TRUSTED_PROXIES: ${XIAOZHI_SECURITY_TRUSTED_PROXIES:-}
  # 设备接入鉴权密钥，留空等于不设防
  XIAOZHI_DEVICE_AUTH_SECRET: ${XIAOZHI_DEVICE_AUTH_SECRET:-}
  # StackChan 整机家庭自用：首次 OTA 自动建档并归属到 owner-user-id 的默认角色
  XIAOZHI_STACKCHAN_AUTO_PROVISION: ${XIAOZHI_STACKCHAN_AUTO_PROVISION:-true}
  XIAOZHI_STACKCHAN_OWNER_USER_ID: ${XIAOZHI_STACKCHAN_OWNER_USER_ID:-1}
  TZ: ${TZ:-Asia/Shanghai}
  # 以下几项之前只写在 .env.example 里，没接进容器，等于开关不存在；现在显式下发
  XIAOZHI_OPS_TOKEN: ${XIAOZHI_OPS_TOKEN:-}
  XIAOZHI_MQTT_ENABLED: ${XIAOZHI_MQTT_ENABLED:-false}
  # 注意：属性名是 xiaozhi.mqtt.broker-url，环境变量必须写成 XIAOZHI_MQTT_BROKER_URL
  XIAOZHI_MQTT_BROKER_URL: ${XIAOZHI_MQTT_BROKER_URL:-tcp://emqx:1883}
  XIAOZHI_MQTT_PUBLIC_ENDPOINT: ${XIAOZHI_MQTT_PUBLIC_ENDPOINT:-}
  XIAOZHI_MQTT_USERNAME: ${XIAOZHI_MQTT_USERNAME:-}
  XIAOZHI_MQTT_PASSWORD: ${XIAOZHI_MQTT_PASSWORD:-}
  # 主题模板/客户端标识/QoS/在线 TTL：默认值与 yml 保持一致，改了必须与固件约定同步
  XIAOZHI_MQTT_TOPIC_TEMPLATE: ${XIAOZHI_MQTT_TOPIC_TEMPLATE:-devices/p2p/{deviceId}}
  XIAOZHI_MQTT_CLIENT_ID: ${XIAOZHI_MQTT_CLIENT_ID:-xiaozhi-dialogue}
  XIAOZHI_MQTT_QOS: ${XIAOZHI_MQTT_QOS:-1}
  XIAOZHI_MQTT_PRESENCE_TTL: ${XIAOZHI_MQTT_PRESENCE_TTL:-120}
  # 联网搜索（DeepSeek Search API）：留空 api-key 时自动复用角色 DeepSeek 模型的 Key
  XIAOZHI_SEARCH_API_KEY: ${XIAOZHI_SEARCH_API_KEY:-}
  XIAOZHI_SEARCH_BASE_URL: ${XIAOZHI_SEARCH_BASE_URL:-https://api.deepseek.com}
  XIAOZHI_SEARCH_COUNT: ${XIAOZHI_SEARCH_COUNT:-5}
  XIAOZHI_SEARCH_TIMEOUT_SECONDS: ${XIAOZHI_SEARCH_TIMEOUT_SECONDS:-8}
  XIAOZHI_MEMORY_AUTO_EXTRACT: ${XIAOZHI_MEMORY_AUTO_EXTRACT:-false}
  XIAOZHI_MCP_ALLOW_WRITE: ${XIAOZHI_MCP_ALLOW_WRITE:-false}

services:
  mysql:
    image: mysql:8.0-debian
    restart: always
    ports:
      - "127.0.0.1:${MYSQL_PORT:-13306}:3306"  # 只监听回环
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-abc123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xiaozhi}
      MYSQL_USER: ${MYSQL_USER:-xiaozhi}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123456}
      LANG: C.UTF-8
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - mysql_data:/var/lib/mysql  # 持久化数据
      # 项目已不再使用 Flyway，建表靠这个脚本；只在数据目录为空时执行
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u $$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - xiaozhi
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - xiaozhi
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # MQTT broker：设备的控制面通道（唤醒、主动推送、远程指令、状态上报）
  # 匿名访问只在本 compose 内网有效；对外不映射 1883，避免裸奔在公网
  emqx:
    image: emqx/emqx:5.8.4
    restart: always
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-xiaozhi2024}
      EMQX_ALLOW_ANONYMOUS: 'true'
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${EMQX_DASHBOARD_PORT:-18083}:18083"   # 控制台只监听回环
      - "${EMQX_PORT:-1883}:1883"                          # 设备直连端口
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    networks:
      - xiaozhi
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
  server:
    image: ${XIAOZHI_IMAGE_SERVER:-ghcr.io/github-lcb/xiaozhi-server}:${XIAOZHI_TAG:-latest}
    container_name: xiaozhi-server
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_started
    ports:
      - "${SERVER_PORT:-8091}:8091"
    environment: *app-environment
    # audio/uploads 必须与 dialogue 共享，否则 TTS 缓存与上传文件互相读不到
    volumes:
      - audio_data:/app/audio
      - uploads_data:/app/uploads
      # 曲库：必须和 dialogue 挂同一份宿主机 ./music，否则后台上传的歌写进命名卷、设备端读的是宿主机目录，互相看不见
      - ./music:/app/uploads/music
      - server_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8091'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s  # 首次启动要等 db/init.sql 建完表
    networks:
      - xiaozhi
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  dialogue:
    image: ${XIAOZHI_IMAGE_DIALOGUE:-ghcr.io/github-lcb/xiaozhi-dialogue}:${XIAOZHI_TAG:-latest}
    container_name: xiaozhi-dialogue
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      # 等 server 建完表
      server:
        condition: service_healthy
    ports:
      - "${DIALOGUE_PORT:-8092}:8092"
    environment: *app-environment
    volumes:
      - audio_data:/app/audio
      - uploads_data:/app/uploads
      # 音乐库：映射到宿主机 ./music，直接 scp 传歌即可
      - ./music:/app/uploads/music
      - dialogue_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8092'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - xiaozhi
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G  # VOSK_MODEL_SIZE 换成 standard 时要调大
        reservations:
          cpus: '0.5'
          memory: 512M

  web:
    image: ${XIAOZHI_IMAGE_WEB:-ghcr.io/github-lcb/xiaozhi-web}:${XIAOZHI_TAG:-latest}
    container_name: xiaozhi-web
    restart: always
    depends_on:
      - server
      - dialogue
    ports:
      - "${WEB_PORT:-8084}:8084"
    healthcheck:
      # 不能写 localhost：容器内会先解析到 ::1，而 nginx 只监听 IPv4，健康检查会一直失败
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8084/ >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - xiaozhi
    logging: *default-logging

networks:
  xiaozhi:
    name: xiaozhi-network

volumes:
  mysql_data:
  redis_data:
  emqx_data:
  emqx_log:
  audio_data:            # 对话录音与 TTS 缓存
  uploads_data:          # 用户上传文件
  server_logs:
  dialogue_logs:
