# ============================================================
# Dialogue 独立部署配置
# 与 server 共用的部分见 xiaozhi-common 的 application-common.yml
# （下面 spring.config.import 引入），本文件只放 dialogue 独有或与
# server 取值不同的项
# ============================================================

server:
  port: 8092

spring:
  config:
    import: classpath:application-common.yml

  # 数据源配置（与 server 共享同一数据库）
  datasource:
    hikari:
      pool-name: DialogueHikariCP

  # 默认 dev（mvn spring-boot:run、java -jar、bin/*.sh、docker compose 都一样）；
  # 走生产要显式指定：SPRING_PROFILES_ACTIVE=prod、--spring.profiles.active=prod 或 ./xiaozhi.sh start prod
  profiles:
    active: dev

# ============================================================
# MQTT 设备通道：设备断电断网不像 WebSocket 有明确的关闭事件，
# 靠心跳续期 + 巡检置离线；关闭时 dialogue 不连 broker，设备继续走 WebSocket
# ============================================================
xiaozhi:
  mqtt:
    enabled: ${XIAOZHI_MQTT_ENABLED:false}
    broker-url: ${XIAOZHI_MQTT_BROKER_URL:tcp://127.0.0.1:1883}
    # 下发给设备的 broker 地址，留空复用 broker-url（Docker 内网地址设备访问不到时要单独配）
    public-endpoint: ${XIAOZHI_MQTT_PUBLIC_ENDPOINT:}
    client-id: ${XIAOZHI_MQTT_CLIENT_ID:xiaozhi-dialogue}
    username: ${XIAOZHI_MQTT_USERNAME:}
    password: ${XIAOZHI_MQTT_PASSWORD:}
    topic-template: ${XIAOZHI_MQTT_TOPIC_TEMPLATE:devices/p2p/{deviceId}}
    qos: ${XIAOZHI_MQTT_QOS:1}
    presence-ttl-seconds: ${XIAOZHI_MQTT_PRESENCE_TTL:120}

# ============================================================
# 联网搜索：DeepSeek 独立 Search API（POST /v1/tools/search）
# 不配 api-key 时，角色用的是 DeepSeek 模型就自动复用该模型配置里的 Key
# ============================================================
  search:
    api-key: ${XIAOZHI_SEARCH_API_KEY:}
    base-url: ${XIAOZHI_SEARCH_BASE_URL:https://api.deepseek.com}
    count: ${XIAOZHI_SEARCH_COUNT:5}
    timeout-seconds: ${XIAOZHI_SEARCH_TIMEOUT_SECONDS:8}

# ============================================================
# Sa-Token（共用字段见 application-common.yml）
# ============================================================
sa-token:
  jwt-secret-key: xiaozhi-esp32-server-java-jwt-secret-key
