# ============================================================
# server 独立配置
# 与 dialogue 共用的部分见 xiaozhi-common 的 application-common.yml
# （下面 spring.config.import 引入），本文件只放 server 独有或与
# dialogue 取值不同的项
# ============================================================

server:
  port: 8091

# ============================================================
# 数据源配置
# ============================================================
spring:
  config:
    import: classpath:application-common.yml

  datasource:
    hikari:
      pool-name: ServerHikariCP

  # 数据库结构与初始数据统一由仓库根目录的 db/init.sql 建立：
  #   mysql -uroot -p < db/init.sql
  # 应用不做任何迁移，结构变更直接改 db/init.sql 并同步实体。

  # JMX 配置
  jmx:
    enabled: false

  # 静态资源配置
  web:
    resources:
      add-mappings: true

  # 默认 dev（mvn spring-boot:run、java -jar、bin/*.sh、docker compose 都一样）；
  # 走生产要显式指定：SPRING_PROFILES_ACTIVE=prod、--spring.profiles.active=prod 或 ./xiaozhi.sh start prod
  profiles:
    active: dev

  # MCP Server（SSE 接入点）：客户端 POST /mcp/sse 建会话，后续消息走 /mcp/message
  # 注意：同一份 yml 里 spring: 只能出现一次，这里必须并入上面的 spring 块，不能另起一个
  ai:
    mcp:
      server:
        name: xiaozhi-esp32-server-java
        version: 6.2.0
        type: SYNC
        sse-message-endpoint: /mcp/message
        sse-endpoint: /mcp/sse

# ============================================================
# 邮件（注册与找回密码的验证码）
# 未配置时不发信，接口返回发送失败
# ============================================================
email:
  smtp:
    username: ${EMAIL_SMTP_USERNAME:}
    password: ${EMAIL_SMTP_PASSWORD:}

# ============================================================
# 小智扩展配置
# ============================================================
xiaozhi:
  # 安全用途（限流、封禁、登录审计）的客户端 IP 判定
  security:
    # 反向代理的 IP 或 CIDR，逗号分隔或 YAML 列表（如 172.16.0.0/12,10.0.0.0/8）
    # 留空表示不采信任何 X-Forwarded-For，只认 TCP 对端地址
    # 前面挂了 Nginx/LB 又不配，所有请求会被算成同一个网关 IP、共用一份限流额度
    trusted-proxies:
  communication:
    # OTA 下发的 WS 二进制帧版本：1=裸Opus，2=带时间戳(服务端AEC需要)，3=带长度头无时间戳
    websocket-protocol-version: 2
  # 运维端点：令牌只放行 /actuator/health 与 /actuator/prometheus，留空则只认登录态
  ops:
    token: ${XIAOZHI_OPS_TOKEN:}
  # MCP 接入点：把服务端工具以 SSE 暴露给外部客户端（如 Claude Desktop / Cursor）
  mcp:
    server:
      # 写操作（让设备播报通知）默认关闭，避免外部客户端误触发
      allow-write: ${XIAOZHI_MCP_ALLOW_WRITE:false}
  # MQTT 设备通道：这里只用它给设备下发 OTA 里的 mqtt 块，连 broker 的是 dialogue
  mqtt:
    enabled: ${XIAOZHI_MQTT_ENABLED:false}
    broker-url: ${XIAOZHI_MQTT_BROKER_URL:tcp://127.0.0.1:1883}
    public-endpoint: ${XIAOZHI_MQTT_PUBLIC_ENDPOINT:}
    client-id: ${XIAOZHI_MQTT_CLIENT_ID:xiaozhi-dialogue}
    username: ${XIAOZHI_MQTT_USERNAME:}
    password: ${XIAOZHI_MQTT_PASSWORD:}
    topic-template: ${XIAOZHI_MQTT_TOPIC_TEMPLATE:devices/p2p/{deviceId}}
    qos: ${XIAOZHI_MQTT_QOS:1}
    presence-ttl-seconds: ${XIAOZHI_MQTT_PRESENCE_TTL:120}

# ============================================================
# 运维指标：Prometheus 抓取 /actuator/prometheus
# 抓取请求带不了登录态，需要配 XIAOZHI_OPS_TOKEN 并在抓取配置里带 X-Ops-Token 头
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: xiaozhi-server

# ============================================================
# SpringDoc OpenAPI 配置
# ============================================================
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: /v3/api-docs

# ============================================================
# Sa-Token：JWT 秘钥（使用JWT Simple模式时必须配置，至少32位）
# 其余共用字段见 application-common.yml
# ============================================================
sa-token:
  jwt-secret-key: ${JWT_SECRET_KEY:xiaozhi-esp32-server-java-jwt-secret-key}

